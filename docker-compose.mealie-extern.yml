# Ein gemeinsames Mealie für zwei Instanzen – über ein eigenes Docker-Netz.
#
# Warum überhaupt: erreicht die zweite Instanz Mealie über die NAS-Adresse
# (http://<NAS>:9925), scheitert das auf der Synology gern an der Firewall –
# erkennbar an
#   UND_ERR_CONNECT_TIMEOUT (Mealie unter http://192.168.69.10:9925)
# also: Adresse richtig, Dienst da, aber die Pakete versickern.
#
# Diese Datei legt beide Beteiligten in ein DRITTES, eigenes Netz. Sie wird von
# BEIDEN Stacks eingebunden – der Zusatz greift jeweils nur für die Dienste,
# die der Stack auch startet:
#
#   * erste Instanz  -> ihr `mealie` wird im gemeinsamen Netz erreichbar
#   * zweite Instanz -> ihre App darf hinein (ihr `mealie` läuft ja nicht)
#
# Bewusst NICHT das Standardnetz der ersten Instanz mitbenutzen: dort stünden
# auch deren App und Cookidoo-Brücke, und weil Dienstnamen in jedem Stack
# gleich heißen (`cookidoo-bridge`), wäre nicht mehr eindeutig, welche Brücke
# gemeint ist. Ein eigenes Netz enthält nur, was geteilt werden soll.
#
# Einrichten:
#
#   1. Netz einmalig anlegen (gehört keinem Stack):
#        sudo docker network create mealie-share
#
#   2. In BEIDEN Stacks als Variable setzen:
#        MEALIE_NETWORK=mealie-share
#
#      Zweite Instanz zusätzlich:
#        COMPOSE_PROFILES=            (kein eigenes Mealie starten)
#        MEALIE_URL=http://mealie:9000
#
#   3. Diese Datei ist ein ZUSATZ zur Hauptdatei, keine eigenständige.
#
#      In Portainer beim Stack:
#        Compose path      docker-compose.yml
#        Additional paths  + Add file -> docker-compose.mealie-extern.yml
#
#      Das Feld "Additional paths" ist genau dafür da. Zwei Pfade in das eine
#      Feld "Compose path" zu schreiben hilft NICHT – es wird nur der erste
#      angewandt, der Redeploy läuft fehlerfrei durch, und trotzdem hängt
#      danach niemand im gemeinsamen Netz.
#
#      Von der Shell entsprechend beide Dateien:
#        S=<Portainer-Datenpfad>/compose/<stack-id>
#        sudo docker compose -p <projektname> --project-directory "$S" \
#          --env-file "$S/stack.env" \
#          -f "$S/docker-compose.yml" -f "$S/docker-compose.mealie-extern.yml" \
#          up -d
#
# Eigene Dienste immer über den CONTAINER-Namen ansprechen, nicht über den
# Dienstnamen: `cookidoo-bridge` heißt der Dienst in jedem Stack gleich, der
# Container dank COOKIDOO_CONTAINER_NAME aber nicht. Also in der zweiten
# Instanz z. B.
#     COOKIDOO_CONTAINER_NAME=cookidoo-jan
#     COOKIDOO_URL=http://cookidoo-jan:8099

services:
  bring-interface:
    networks:
      - default
      - mealie_share

  # Greift nur, wenn dieser Stack Mealie auch startet (Profil `mealie`).
  mealie:
    networks:
      - default
      - mealie_share

networks:
  mealie_share:
    external: true
    # Ohne Standardwert nähme Compose bei leerer Variable den Schlüssel
    # "mealie_share" (Unterstrich!) als Netznamen – und suchte damit ein Netz,
    # das es nicht gibt. Der Standard passt zu `docker network create` oben.
    name: ${MEALIE_NETWORK:-mealie-share}
