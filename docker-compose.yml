services:
  bring-interface:
    build: .
    # Absichtlich OHNE festen "image:"-Namen und mit pull_policy: build.
    # Sonst versucht "docker compose pull" – das Portainer beim Deploy/Redeploy
    # einer Git-Stack ausführt – das Image "bring-interface" von Docker Hub zu
    # holen und bricht mit "pull access denied" ab. Das Image entsteht hier aus
    # dem Dockerfile, es liegt in keiner Registry.
    pull_policy: build
    container_name: bring-interface
    restart: unless-stopped
    ports:
      # Linke Zahl = Port auf der NAS (per HOST_PORT änderbar), rechte = im Container
      - "${HOST_PORT:-8095}:3000"
    environment:
      BRING_MAIL: ${BRING_MAIL}
      BRING_PASSWORD: ${BRING_PASSWORD}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      APP_PASSWORD: ${APP_PASSWORD}
      APP_SECRET: ${APP_SECRET}
      # Token für Maschinen-Zugriffe (FHEM, Skripte) auf die /api/-Routen
      API_TOKEN: ${API_TOKEN}
      # Mealie als Rezeptquelle (optional)
      MEALIE_URL: ${MEALIE_URL}
      MEALIE_TOKEN: ${MEALIE_TOKEN}
      MEALIE_SYNC_MINUTES: ${MEALIE_SYNC_MINUTES:-15}
      MEALIE_PUSH_RATINGS: ${MEALIE_PUSH_RATINGS:-1}
      MEALIE_RECIPE_URL: ${MEALIE_RECIPE_URL:-}
      # Rezept-Import (optional, Standardwerte reichen normalerweise)
      IMPORT_DELAY_MS: ${IMPORT_DELAY_MS:-250}
      IMPORT_CONCURRENCY: ${IMPORT_CONCURRENCY:-3}
      IMPORT_TIMEOUT_MS: ${IMPORT_TIMEOUT_MS:-20000}
      PORT: 3000
      DB_PATH: /data/recipes.db
    volumes:
      # DATA_PATH leer  -> benanntes Docker-Volume "bring-data" (portabel, Standard)
      # DATA_PATH gesetzt -> Bind-Mount auf einen Host-Ordner,
      #   z. B. in Portainer: DATA_PATH=/volume2/docker/BRING/data
      - "${DATA_PATH:-bring-data}:/data"

  # ── Mealie (optional) ──────────────────────────────────────────────────────
  # Standardmäßig AUS. Einschalten mit der Stack-Variable
  #   COMPOSE_PROFILES=mealie
  # (oder indem man die profiles-Zeile hier löscht). Danach in den Variablen
  #   MEALIE_URL=http://mealie:9000
  # setzen – die beiden Container erreichen sich über den Dienstnamen, dafür
  # muss kein Port nach außen offen sein. Der Port unten ist nur für die
  # Mealie-Oberfläche im Browser.
  mealie:
    profiles: ["mealie"]
    image: ghcr.io/mealie-recipes/mealie:${MEALIE_VERSION:-v3.22.0}
    container_name: mealie
    restart: unless-stopped
    ports:
      - "${MEALIE_PORT:-9925}:9000"
    environment:
      ALLOW_SIGNUP: "false"
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Berlin}
      # Adresse, unter der Mealie im Browser erreichbar ist (für Links/Mails)
      BASE_URL: ${MEALIE_BASE_URL:-http://localhost:9925}
      # Erstes Konto beim allerersten Start; Passwort danach in Mealie ändern.
      DEFAULT_EMAIL: ${MEALIE_DEFAULT_EMAIL:-changeme@email.com}
    volumes:
      # Benanntes Volume – SQLite gehört nicht auf eine Netzwerkfreigabe.
      - mealie-data:/app/data
    deploy:
      resources:
        limits:
          memory: 1000M

volumes:
  bring-data:
  mealie-data:
